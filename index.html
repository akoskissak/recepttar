<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recepttár — receptek makrókkal</title>
<meta name="description" content="43 recept két kalóriakerethez, étrendtervvel és naptárral.">
<meta name="theme-color" content="#F5F0E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recepttár">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Karla:wght@400;500;600;700&display=swap');

.rt, .rt *, .rt *::before, .rt *::after { box-sizing: border-box; }

.rt {
  --paper: #F5F0E3;
  --card: #FFFDF7;
  --ink: #2B2620;
  --ink-60: #6C6355;
  --ink-30: #A69B89;
  --hair: #E3DAC5;
  --blue: #2E6A8C;
  --blue-soft: #E4EDF2;
  --butter: #DFA229;
  --tomato: #BE4A33;
  --tomato-soft: #F8E6E1;

  --disp: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Karla', ui-sans-serif, system-ui, -apple-system, sans-serif;

  font-family: var(--body); color: var(--ink); background: var(--paper);
  line-height: 1.5; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; min-height: 100%; padding-bottom: 128px;
}
.rt button, .rt input, .rt textarea, .rt select { font: inherit; color: inherit; }
.rt button { cursor: pointer; background: none; border: 0; padding: 0; }
.rt :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 5px; }

.rt-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-60); }
.mP { color: var(--blue); } .mC { color: var(--butter); } .mF { color: var(--tomato); }
.kp { background: var(--blue); } .kc { background: var(--butter); } .kf { background: var(--tomato); }

/* ---------- gombok: nagy, kényelmes felület ---------- */
.rt .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 42px; padding: 0 20px; border-radius: 11px;
  font-size: 14px; font-weight: 700; white-space: nowrap;
  transition: background .16s, border-color .16s, color .16s, transform .12s;
}
.rt .btn:active { transform: translateY(1px); }
.btn-p { background: var(--blue); color: #fff; box-shadow: 0 2px 0 #1F4E68; }
.btn-p:hover { background: #35789D; }
.btn-p:active { box-shadow: 0 1px 0 #1F4E68; }
.btn-s { background: var(--card); color: var(--ink); border: 1.5px solid var(--hair); box-shadow: 0 2px 0 rgba(43,38,32,.07); }
.btn-s:hover { border-color: var(--ink-60); background: #fff; }
.btn-g { color: var(--ink-60); }
.btn-g:hover { background: rgba(43,38,32,.07); color: var(--ink); }
.btn-d { color: var(--tomato); border: 1.5px solid rgba(190,74,51,.32); }
.btn-d:hover { background: var(--tomato-soft); border-color: var(--tomato); }
.rt .btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; border-radius: 9px; }
.rt .btn-ico { min-height: 40px; min-width: 40px; padding: 0; border-radius: 11px; }

/* ---------- fejléc ---------- */
.rt-hd { max-width: 1160px; margin: 0 auto; padding: 26px 26px 0; }
.rt-title { font-family: var(--disp); font-weight: 700; font-size: clamp(28px, 4.2vw, 38px); line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.rt-lede { font-size: 14.5px; color: var(--ink-60); margin: 6px 0 0; max-width: 62ch; }

.rt-tabs {
  max-width: 1160px; margin: 0 auto; padding: 20px 26px 0; display: flex; gap: 22px;
  border-bottom: 1.5px solid var(--hair);
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.rt-tabs::-webkit-scrollbar { display: none; }
.rt-tabs button { flex-shrink: 0; }
.rt-tabs button {
  font-family: var(--disp); font-weight: 600; font-size: 15.5px; color: var(--ink-30);
  padding: 6px 0 12px; border-bottom: 3px solid transparent; margin-bottom: -1.5px;
  transition: color .18s, border-color .18s;
}
.rt-tabs button:hover { color: var(--ink-60); }
.rt-tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--blue); }
.rt-tabs .badge { font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--ink-30); background: rgba(43,38,32,.07); border-radius: 99px; padding: 1px 6px; margin-left: 6px; }
#tabAcc { font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--ink-60); border-bottom: none; padding: 6px 0 12px; }
#tabAcc:hover { color: var(--ink); }
.acc-dot-on { background: #3F8F5C !important; }
.acc-dot-off { background: var(--ink-30) !important; }

/* fiok lap */
.rt-acc-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1.5px dashed var(--hair); }
.rt-acc-row:last-child { border-bottom: 0; }
.rt-acc-row .who { flex: 1; min-width: 0; }
.rt-acc-row .who b { display: block; font-size: 14.5px; font-weight: 700; }
.rt-acc-row .who span { font-size: 12.5px; color: var(--ink-60); }
.rt-sync-badge { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.rt-sync-on { background: #E3F1E7; color: #2E7047; }
.rt-sync-off { background: rgba(43,38,32,.07); color: var(--ink-60); }

/* ---------- eszközsor ---------- */
.rt-tools { max-width: 1160px; margin: 0 auto; padding: 18px 26px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rt-nav { display: flex; gap: 5px; flex-wrap: wrap; margin-right: auto; }
.rt-nav button {
  min-height: 38px; padding: 0 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  color: var(--ink-60); display: inline-flex; align-items: center; transition: all .16s;
}
.rt-nav button:hover { background: rgba(43,38,32,.075); color: var(--ink); }
.rt-nav button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.rt-search {
  border: 1.5px solid var(--hair); background: var(--card); border-radius: 999px;
  min-height: 40px; padding: 0 42px 0 16px; font-size: 13.5px; width: 220px; transition: border-color .16s;
}
.rt-search::placeholder { color: var(--ink-30); }
.rt-search:focus { outline: none; border-color: var(--blue); }

/* rendezés + "belefér ma" szűrő */
.rt-sort {
  border: 1.5px solid var(--hair); background: var(--card); border-radius: 999px;
  min-height: 40px; padding: 0 34px 0 14px; font-size: 13px; font-weight: 600;
  appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-60) 50%), linear-gradient(135deg, var(--ink-60) 50%, transparent 50%);
  background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.rt-sort:focus { outline: none; border-color: var(--blue); }
.rt .rt-fit {
  min-height: 40px; padding: 0 15px; border-radius: 999px; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--hair); background: var(--card); color: var(--ink-60);
  display: inline-flex; align-items: center; gap: 7px;
}
.rt .rt-fit:hover { border-color: var(--ink-60); color: var(--ink); }
.rt .rt-fit[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.rt-budget {
  margin: 0 0 14px; padding: 11px 14px; background: var(--blue-soft);
  border-radius: 10px; font-size: 13.5px; display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline;
}
.rt-budget b { font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.rt-budget .tele { color: var(--tomato); }

.rt-key { max-width: 1160px; margin: 0 auto; padding: 16px 26px 0; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-60); }
.rt-key span { display: inline-flex; align-items: center; gap: 6px; }
.rt-key i { width: 10px; height: 10px; border-radius: 3px; display: block; }

/* ---------- receptkártyák ---------- */
.rt-main { max-width: 1160px; margin: 0 auto; padding: 14px 26px 40px; }
.rt-count { margin: 0 0 14px; }
.rt-grid { display: grid; gap: 16px; grid-auto-rows: 1fr; grid-template-columns: repeat(auto-fill, minmax(316px, 1fr)); }

.rt-card {
  background: var(--card); border-radius: 13px; padding: 15px 17px 16px;
  display: flex; flex-direction: column; text-align: left; height: 100%;
  border: 1.5px solid var(--hair); box-shadow: 0 2px 0 rgba(43,38,32,.05);
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.rt-card:hover { transform: translateY(-3px); border-color: rgba(46,106,140,.4); box-shadow: 0 8px 0 -2px rgba(43,38,32,.06), 0 12px 24px -14px rgba(43,38,32,.3); }
.rt .rt-open { text-align: left; display: block; width: 100%; padding: 5px 0; margin: -5px 0; border-radius: 8px; }
.rt-open:hover .rt-name { color: var(--blue); }

.rt-top { display: flex; align-items: center; gap: 8px; }
.rt-cat { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-60); background: rgba(43,38,32,.06); padding: 5px 9px; border-radius: 6px; }
.rt-min { font-size: 12.5px; color: var(--ink-30); margin-right: auto; }
.rt-act { display: flex; gap: 5px; }
.rt-act button {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  font-size: 16px; color: var(--ink-60); line-height: 1;
  border: 1.5px solid transparent; transition: all .16s;
}
.rt-act button:hover { background: rgba(43,38,32,.08); border-color: var(--hair); color: var(--ink); }
.rt-act button.on { background: var(--blue-soft); border-color: rgba(46,106,140,.35); color: var(--blue); }
/* ha mar a mai etrendben van, a hover a kivetelt kinalja */
.rt-act button.on .ic-x { display: none; }
.rt-act button.on:hover, .rt-act button.on:focus-visible {
  background: var(--tomato-soft); border-color: rgba(190,74,51,.45); color: var(--tomato);
}
.rt-act button.on:hover .ic-v, .rt-act button.on:focus-visible .ic-v { display: none; }
.rt-act button.on:hover .ic-x, .rt-act button.on:focus-visible .ic-x { display: block; }
/* erintokijelzon nincs hover: ott allandoan a ✕ lathato, hogy a koppintas ne legyen megleptes */
@media (hover: none) {
  .rt-act button.on { background: var(--tomato-soft); border-color: rgba(190,74,51,.45); color: var(--tomato); }
  .rt-act button.on .ic-v { display: none; }
  .rt-act button.on .ic-x { display: block; }
}

.rt-name { font-family: var(--disp); font-weight: 600; font-size: 19px; line-height: 1.2; letter-spacing: -.012em; margin: 11px 0 0; text-wrap: balance; }
.rt-tear { margin: 13px 0 12px; border-top: 1.5px dashed var(--hair); }

/* mindkét keret egymás alatt, egy kártyán */
.rt-fr + .rt-fr { margin-top: 11px; padding-top: 11px; border-top: 1px solid rgba(43,38,32,.07); }
.rt-fr-hd { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.rt-chip { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--ink-60); background: rgba(43,38,32,.07); padding: 3px 7px; border-radius: 5px; }
.rt-fr-k { font-family: var(--disp); font-weight: 700; font-size: 19px; letter-spacing: -.02em; line-height: 1; }
.rt-fr-u { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-60); }
.rt-ms { display: flex; gap: 11px; margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; }
.rt-ms i { font-style: normal; font-weight: 700; margin-right: 2px; }
.rt-bar { margin-top: 9px; height: 6px; border-radius: 99px; background: rgba(43,38,32,.07); overflow: hidden; }
.rt-bar > div { height: 100%; display: flex; border-radius: 99px; overflow: hidden; }
.rt-bar i { display: block; height: 100%; }
.rt-nofr { font-size: 12.5px; color: var(--ink-30); margin: 11px 0 0; padding-top: 11px; border-top: 1px solid rgba(43,38,32,.07); }

/* ---------- étrendterv ---------- */
.rt-plan-v { max-width: 1160px; margin: 0 auto; padding: 20px 26px 40px; }
.rt-wk { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.rt-wk h2 { font-family: var(--disp); font-weight: 700; font-size: 21px; letter-spacing: -.02em; margin: 0; min-width: 210px; }
.rt-days-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
.rt-dcard { background: var(--card); border: 1.5px solid var(--hair); border-radius: 13px; padding: 14px 15px 15px; box-shadow: 0 2px 0 rgba(43,38,32,.05); }
.rt-dcard.ma { border-color: var(--ink); border-width: 2px; }
.rt-dcard-hd { display: flex; align-items: baseline; gap: 8px; padding-bottom: 11px; border-bottom: 1.5px dashed var(--hair); }
.rt-dcard-hd b { font-family: var(--disp); font-weight: 700; font-size: 15.5px; }
.rt-dcard-hd s { text-decoration: none; font-size: 12.5px; color: var(--ink-30); margin-right: auto; }
.rt-mabadge { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #fff; background: var(--ink); padding: 3px 7px; border-radius: 5px; }

.rt-slot { padding: 11px 0 0; }
.rt-slot > p { margin: 0 0 6px; }
.rt-slot ul { list-style: none; margin: 0 0 6px; padding: 0; }
.rt-slot li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13.5px; }
.rt-slot li span:first-child { flex: 1; min-width: 0; }
.rt-slot li .k { font-size: 12px; font-weight: 700; color: var(--ink-60); white-space: nowrap; }
.rt .rt-rm { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-30); font-size: 16px; flex: 0 0 36px; transition: all .15s; }
.rt-rm:hover { background: var(--tomato-soft); color: var(--tomato); }
.rt .rt-addslot {
  width: 100%; min-height: 36px; border-radius: 9px; border: 1.5px dashed var(--hair);
  font-size: 12.5px; font-weight: 700; color: var(--ink-60);
  display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .16s;
}
.rt-addslot:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); border-style: solid; }

.rt-dsum { margin-top: 14px; padding-top: 12px; border-top: 1.5px dashed var(--hair); }
.rt-dsum-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.rt-dsum-row + .rt-dsum-row { margin-top: 9px; }
.rt-dsum-row b { font-family: var(--disp); font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.rt-dsum-row s { text-decoration: none; color: var(--ink-30); font-size: 12px; margin-right: auto; }
.rt-dsum-row em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--ink-60); }
.rt-dsum .rt-bar { margin-top: 5px; }
.rt-over { color: var(--tomato) !important; }

/* ---------- naptár ---------- */
/* heti összegzés */
.rt-wksum { display: flex; gap: 22px; flex-wrap: wrap; margin: 0 0 20px; }
.rt-wksum div b { font-family: var(--disp); font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: -.02em; display: block; }
.rt-wksum div u { text-decoration: none; display: block; margin-top: 5px; }

/* nap-műveletek a napkártya alján */
.rt-dact { display: flex; gap: 3px; margin-top: 12px; padding-top: 10px; border-top: 1.5px dashed var(--hair); }
.rt .rt-dact button {
  flex: 1; min-height: 36px; border-radius: 9px; font-size: 12px; font-weight: 700;
  color: var(--ink-60); transition: all .15s;
}
.rt .rt-dact button:hover { background: rgba(43,38,32,.08); color: var(--ink); }
.rt .rt-dact button.d:hover { background: var(--tomato-soft); color: var(--tomato); }

/* nap-választó lista a másoláshoz */
.rt-pickday { list-style: none; margin: 12px 0 0; padding: 0; }
.rt-pickday li { border-bottom: 1.5px dashed var(--hair); }
.rt .rt-pickday button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 8px; text-align: left; border-radius: 9px; min-height: 44px; }
.rt .rt-pickday button:hover { background: var(--blue-soft); }
.rt-pickday .nm { flex: 1; font-size: 14.5px; font-weight: 600; }
.rt-pickday .st { font-size: 12px; font-weight: 700; color: var(--ink-30); white-space: nowrap; }
.rt-pickday .st.van { color: var(--tomato); }

.rt-cal { max-width: 1160px; margin: 0 auto; padding: 20px 26px 40px; }
.rt-cal-hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.rt-cal-hd h2 { font-family: var(--disp); font-weight: 700; font-size: 21px; letter-spacing: -.02em; margin: 0; min-width: 190px; }
.rt-cal-sum { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 20px; }
.rt-cal-sum div b { font-family: var(--disp); font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: -.02em; display: block; }
.rt-cal-sum div u { text-decoration: none; display: block; margin-top: 5px; }
.rt-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 7px; }
.rt-dow span { text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-30); }
.rt-daysc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
.rt-day { aspect-ratio: 1/1; border-radius: 11px; border: 1.5px solid var(--hair); background: var(--card); padding: 7px 7px 6px; display: flex; flex-direction: column; text-align: left; transition: border-color .16s, transform .16s; }
.rt-day.blank { border: 0; background: none; }
.rt-day.has:hover { transform: translateY(-2px); border-color: var(--blue); }
.rt-day.empty { background: rgba(43,38,32,.025); cursor: default; }
.rt-day.ma { border-color: var(--ink); border-width: 2px; }
.rt-day-n { font-size: 11.5px; font-weight: 700; color: var(--ink-60); line-height: 1; }
.rt-day-vals { margin-top: auto; display: flex; flex-direction: column; gap: 3px; }
.rt-day-v { display: flex; align-items: baseline; gap: 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; }
.rt-day-v b { font-family: var(--disp); font-size: 13px; letter-spacing: -.02em; line-height: 1; }
.rt-day-v.in { color: var(--blue); } .rt-day-v.ov { color: var(--tomato); }
.rt-cal-empty { margin-top: 18px; padding: 38px 22px; text-align: center; border: 1.5px dashed var(--hair); border-radius: 13px; }
.rt-cal-empty p { font-family: var(--disp); font-weight: 600; font-size: 19px; margin: 0 0 6px; }
.rt-cal-empty small { color: var(--ink-60); }

/* ---------- alsó sáv ---------- */
.rt-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1.5px solid var(--hair); box-shadow: 0 -6px 20px -14px rgba(43,38,32,.4); }
.rt-bottom-in { max-width: 1160px; margin: 0 auto; padding: 12px 26px 13px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.rt-mai { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-30); }
.rt-bfr { min-width: 168px; }
.rt-bfr-r { display: flex; align-items: baseline; gap: 7px; }
.rt-bfr-r b { font-family: var(--disp); font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.rt-bfr-r s { text-decoration: none; font-size: 12px; color: var(--ink-30); margin-right: auto; }
.rt-bfr-r em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--ink-60); }

/* ---------- visszajelzés ---------- */
.rt-toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 124px; z-index: 60; display: flex; flex-direction: column; gap: 8px;
  align-items: center; pointer-events: none; width: max-content;
  max-width: min(520px, calc(100vw - 24px));
}
.rt-toast {
  background: var(--ink); color: #FFFDF7; border-radius: 12px;
  padding: 11px 12px 11px 16px; display: flex; align-items: center; gap: 12px;
  font-size: 13.5px; font-weight: 600; line-height: 1.35; pointer-events: auto;
  box-shadow: 0 10px 28px -10px rgba(43,38,32,.55);
  animation: toastIn .2s cubic-bezier(.2,.8,.2,1);
}
.rt-toast span { min-width: 0; }
.rt .rt-toast button {
  color: #F2C46B; font-weight: 700; font-size: 13px; white-space: nowrap;
  min-height: 36px; padding: 0 12px; border-radius: 8px; flex-shrink: 0;
}
.rt .rt-toast button:hover { background: rgba(255,255,255,.12); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- üres állapotok: cselekvésre hívnak ---------- */
.rt-empty { grid-column: 1/-1; padding: 52px 20px; text-align: center; }
.rt-empty p { font-family: var(--disp); font-weight: 600; font-size: 20px; margin: 0 0 6px; }

/* =====================================================================
   TAROLASI RETEGEK, elsobbsegi sorrendben:
   1) window.storage  -- letezik Claude.ai artifacteken belul
   2) Firebase Realtime Database -- ha be van allitva, tobb eszkoz kozott is szinkronizal
   3) localStorage -- mindig mukodik, de csak ezen a bongeszon/eszkozon

   A Firebase hasznalatahoz toltsd ki a FIREBASE_CONFIG objektumot a sajat,
   ingyenes Firebase projekted adataival. Amig ures/placeholder marad,
   az app automatikusan localStorage-ot hasznal -- Firebase nelkul is mukodik.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAfnvh86QsfKZrw_If_3usKBm-EaIaFgmY",
  authDomain: "recepttar-b6b52.firebaseapp.com",
  databaseURL: "https://recepttar-b6b52-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "recepttar-b6b52",
};

const hasClaudeStorage = () => typeof window.storage !== 'undefined' && window.storage
  && typeof window.storage.get === 'function';
const firebaseConfigured = () => FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('IDE_');

let fbAuth = null, fbDb = null, fbUser = null;
if (firebaseConfigured() && typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.database();
  } catch (e) { console.warn('Firebase init sikertelen:', e); }
}

async function load(k, fb) {
  if (hasClaudeStorage()) {
    try { const r = await window.storage.get(k); return r ? JSON.parse(r.value) : fb; }
    catch (e) { /* meg nincs elmentve -- essunk at a kovetkezo retegre */ }
  }
  if (fbDb && fbUser) {
    try {
      const snap = await fbDb.ref(`users/${fbUser.uid}/${k}`).once('value');
      const v = snap.val();
      if (v !== null && v !== undefined) return v;
    } catch (e) { console.warn('Firebase olvasás sikertelen:', e); }
  }
  try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; }
  catch (e) { return (k in mem) ? mem[k] : fb; }
}
async function save(k, v) {
  mem[k] = v;
  if (hasClaudeStorage()) {
    try { await window.storage.set(k, JSON.stringify(v)); return; } catch (e) {}
  }
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  if (fbDb && fbUser) {
    try { await fbDb.ref(`users/${fbUser.uid}/${k}`).set(v); } catch (e) { console.warn('Firebase mentés sikertelen:', e); }
  }
}

/* belepes utan: ha a felhoben mar van adat, az a mervado; ha ures, feltoltjuk vele az eddigi helyi allapotot */
async function syncAfterSignIn(user) {
  fbUser = user;
  for (const k of [KEYS.fav, KEYS.own, KEYS.etrend]) {
    const fallback = k === KEYS.etrend ? {} : [];
    try {
      const snap = await fbDb.ref(`users/${user.uid}/${k}`).once('value');
      const remote = snap.val();
      if (remote !== null && remote !== undefined) {
        localStorage.setItem(k, JSON.stringify(remote));
      } else {
        const local = await load(k, fallback);
        await fbDb.ref(`users/${user.uid}/${k}`).set(local);
      }
    } catch (e) { console.warn('Szinkronizálás sikertelen:', e); }
  }
  favs = await load(KEYS.fav, []);
  own = await load(KEYS.own, []);
  own.forEach(r => { if (!r.slots) r.slots = slotsOf(r); });
  etrend = await load(KEYS.etrend, {}) || {};
  drawNav(); drawGrid(); drawWeek(); drawCal(); drawBottom();
  drawAccount();
}

const napja = key => etrend[key] || { reggeli: [], ebed: [], vacsora: [], kis: [] };
const maxKcal = () => Math.max(...all().flatMap(r => FRAMES.map(f => r[f.k] ? r[f.k].makro.kcal : 0)), 1);

function napOsszeg(key, fk) {
  const n = napja(key);
  const ids = SLOTS.flatMap(s => n[s.k] || []);
  const items = ids.map(get).filter(r => r && r[fk]);
  const t = items.reduce((a, r) => { const m = r[fk].makro;
    return { kcal: a.kcal + m.kcal, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f }; },
    { kcal: 0, p: 0, c: 0, f: 0 });
  t.n = items.length;
  return t;
}
const vanNap = key => SLOTS.some(s => (napja(key)[s.k] || []).length);

async function setSlot(key, slot, ids) {
  const n = { ...napja(key) };
  n[slot] = ids;
  if (SLOTS.every(s => !(n[s.k] || []).length)) delete etrend[key]; else etrend[key] = n;
  await save(KEYS.etrend, etrend);
  drawWeek(); drawCal(); drawBottom(); drawGrid();
}

/* ---------- visszajelzés és visszavonás ---------- */
let toastT = null, undoSnap = null;

function redrawAll() { drawGrid(); drawWeek(); drawCal(); drawBottom(); }

/* minden etrend-modositas elott lementjuk az elozo allapotot, hogy visszavonhato legyen */
function snapshot() { undoSnap = JSON.parse(JSON.stringify(etrend)); }

function toast(msg, withUndo) {
  const w = el('toasts');
  // az also sav magassaga valtozik (mobilon tobb sorba tord), ezert mindig fole meregetunk
  const bar = document.querySelector('.rt-bottom');
  w.style.bottom = ((bar ? bar.getBoundingClientRect().height : 100) + 14) + 'px';
  w.innerHTML = `<div class="rt-toast"><span>${esc(msg)}</span>${
    withUndo ? `<button id="undoBtn">Visszavonás</button>` : ''}</div>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { w.innerHTML = ''; }, withUndo ? 7000 : 3200);
  if (withUndo) el('undoBtn').onclick = async () => {
    if (undoSnap) {
      etrend = undoSnap; undoSnap = null;
      await save(KEYS.etrend, etrend); redrawAll();
    }
    clearTimeout(toastT); w.innerHTML = '';
    toast('Visszaállítva');
  };
}

/* hany peldanyban es melyik etkezesekben van ma ez a recept */
function maiDb(id) {
  const n = napja(ma());
  return SLOTS.reduce((a, s) => a + (n[s.k] || []).filter(x => x === id).length, 0);
}
function maiHol(id) {
  const n = napja(ma());
  return SLOTS.filter(s => (n[s.k] || []).includes(id)).map(s => s.k);
}

async function addTo(key, slot, id) {
  const cur = napja(key)[slot] || [];
  const max = SLOTMAX[slot];
  const r = get(id);
  let arr, lecserelt = null;

  if (cur.length >= max) {
    // egy napra csak egy reggeli / ebed / vacsora jut, ezert csere lesz belole
    lecserelt = get(cur[cur.length - 1]);
    arr = cur.slice(0, Math.max(0, max - 1)).concat([id]);
  } else {
    arr = cur.concat([id]);
  }

  snapshot();
  await setSlot(key, slot, arr);

  const hol = key === ma()
    ? `a mai ${SLOTHOZ[slot]}`
    : `${HO[+key.split('-')[1] - 1].slice(0,3)}. ${+key.split('-')[2]}., ${SLOTNEV[slot].toLowerCase()}`;

  if (lecserelt && lecserelt.id !== id) {
    toast(`${lecserelt.nev} helyett most ${r.nev} lett ${key === ma() ? SLOTNEV[slot].toLowerCase() : hol}`, true);
  } else if (lecserelt && lecserelt.id === id) {
    toast(`${r.nev} már ${key === ma() ? 'a mai ' + SLOTNEV[slot].toLowerCase() : hol}`, false);
  } else {
    toast(`${r.nev} — hozzáadva ${hol}`, true);
  }
}

/* a kartyarol torles: kiveszi a mai etrend minden etkezesebol */
async function removeToday(id) {
  const r = get(id), holVolt = maiHol(id);
  if (!holVolt.length) return;
  const key = ma(), n = { ...napja(key) };
  holVolt.forEach(s => { n[s] = (n[s] || []).filter(x => x !== id); });
  snapshot();
  if (SLOTS.every(s => !(n[s.k] || []).length)) delete etrend[key]; else etrend[key] = n;
  await save(KEYS.etrend, etrend);
  redrawAll();
  const nevek = holVolt.map(s => SLOTNEV[s].toLowerCase()).join(', ');
  toast(`${r.nev} kivéve a mai étrendből (${nevek})`, true);
}

/* ---------- csík ---------- */
function barHtml(m, max) {
  const ep = m.p * 4, ec = m.c * 4, ef = m.f * 9;
  return `<div class="rt-bar"><div style="width:${(m.kcal / max * 100).toFixed(1)}%">
    <i class="kp" style="flex:${ep}"></i><i class="kc" style="flex:${ec}"></i><i class="kf" style="flex:${ef}"></i>
  </div></div>`;
}
function macroSpan(m) {
  return `<span class="rt-ms"><span><i class="mP">F</i>${num(m.p)}</span><span><i class="mC">Sz</i>${num(m.c)}</span><span><i class="mF">Zs</i>${num(m.f)}</span></span>`;
}

/* ---------- receptek nézet ---------- */
/* mennyi kaloria maradt ma az egyes keretekben */
function maradek() {
  return FRAMES.map(f => ({ cel: f.cel, k: f.k, marad: f.cel - napOsszeg(ma(), f.k).kcal }));
}
/* belefer-e a recept a mai maradekba mindegyik keretben, ahol van valtozata */
function beleferMa(r) {
  return maradek().every(m => !r[m.k] || r[m.k].makro.kcal <= m.marad);
}

function visible() {
  const q = query.trim().toLowerCase();
  let rows = all().filter(r => {
    const sl = slotsOf(r);
    if (filter === 'Kedvencek') { if (!favs.includes(r.id)) return false; }
    else if (filter !== 'Mind') { if (!sl.includes(filter)) return false; }
    if (csakBelefer && !beleferMa(r)) return false;
    if (!q) return true;
    return [r.nev, ...sl.map(s => SLOTNEV[s]), r.a1 ? r.a1.hozz.join(' ') : '', r.a2 ? r.a2.hozz.join(' ') : '']
      .join(' ').toLowerCase().includes(q);
  });

  const k = r => r.a1 ? r.a1.makro.kcal : (r.a2 ? r.a2.makro.kcal : 0);
  const pr = r => r.a1 ? r.a1.makro.p : (r.a2 ? r.a2.makro.p : 0);
  if (sortBy === 'kcalUp') rows = rows.slice().sort((a, b) => k(a) - k(b));
  else if (sortBy === 'kcalDown') rows = rows.slice().sort((a, b) => k(b) - k(a));
  else if (sortBy === 'prot') rows = rows.slice().sort((a, b) => pr(b) - pr(a));
  else if (sortBy === 'perc') rows = rows.slice().sort((a, b) => (a.perc || 0) - (b.perc || 0));
  return rows;
}

function drawBudget() {
  if (!csakBelefer) { el('budget').innerHTML = ''; return; }
  el('budget').innerHTML = `<div class="rt-budget">
    <span class="rt-label" style="letter-spacing:.09em">Ma még belefér</span>
    ${maradek().map(m => `<span><b class="${m.marad < 0 ? 'tele' : ''}">${m.marad}</b> kcal
      <span style="color:var(--ink-60)">az ${keretNev(m.cel)} keretben</span></span>`).join('')}
  </div>`;
}
function drawNav() {
  const opts = [{ k: 'Mind', n: 'Mind' }, ...SLOTS, { k: 'Kedvencek', n: 'Kedvencek' }];
  el('nav').innerHTML = opts.map(o =>
    `<button data-c="${o.k}" aria-pressed="${o.k === filter}">${esc(o.n)}${o.k === 'Kedvencek' && favs.length ? ' ' + favs.length : ''}</button>`
  ).join('');
}
function katNev(r) { return slotsOf(r).map(s => SLOTNEV[s]).join(' · '); }
function holCimke(id) {
  const hol = maiHol(id), db = maiDb(id);
  const nev = hol.map(s => SLOTNEV[s].toLowerCase()).join(', ');
  return db > 1 && hol.length === 1
    ? `A mai ${nev}ben ${db}×`
    : `A mai étrendben: ${nev}`;
}

function drawGrid() {
  const rows = visible(), max = maxKcal();
  drawBudget();
  el('count').textContent = `${rows.length} recept${csakBelefer ? ' — ami ma még belefér' : ''}`;
  if (!rows.length) {
    let cim, mit, gomb;
    if (filter === 'Kedvencek' && !favs.length) {
      cim = 'Még nincs kedvenced';
      mit = 'A kártyákon a csillagra kattintva jelölheted azokat, amiket gyakran főzöl — itt gyűlnek össze.';
      gomb = `<button class="btn btn-p" data-reset="Mind">Mutasd az összes receptet</button>`;
    } else if (query) {
      cim = `Semmi sem passzol erre: „${esc(query)}”`;
      mit = 'A név és a hozzávalók között keresek. Próbáld rövidebb szóval, például „csirke” vagy „joghurt”.';
      gomb = `<button class="btn btn-p" id="emptyClear">Keresés törlése</button>`;
    } else if (csakBelefer) {
      const m = maradek();
      cim = 'Ma már semmi nem fér bele';
      mit = m.some(x => x.marad < 0)
        ? 'Túllépted a keretet, így minden recept kiesett. Vedd ki valamit az étrendből, vagy kapcsold ki a szűrőt.'
        : `A maradék ${m.map(x => x.marad + ' kcal').join(' / ')} kevesebb, mint a legkisebb adag. Kapcsold ki a szűrőt, vagy tervezz holnapra.`;
      gomb = `<button class="btn btn-p" id="emptyFit">Szűrő kikapcsolása</button>`;
    } else {
      cim = `Nincs recept ehhez: ${esc(filter)}`;
      mit = 'Válts étkezést, vagy vedd fel a sajátodat — a makrókat te adod meg, a többit én számolom.';
      gomb = `<button class="btn btn-p" id="emptyNew">+ Új recept</button>`;
    }
    el('grid').innerHTML = `<div class="rt-empty"><p>${cim}</p><small>${mit}</small>${gomb}</div>`;
    if (el('emptyClear')) el('emptyClear').onclick = () => { setQuery(''); el('q').focus(); };
    if (el('emptyNew')) el('emptyNew').onclick = () => openEditor(null);
    if (el('emptyFit')) el('emptyFit').onclick = () => setFit(false);
    return;
  }
  el('grid').innerHTML = rows.map(r => {
    const fav = favs.includes(r.id), db = maiDb(r.id);
    const frames = FRAMES.map(f => {
      const v = r[f.k];
      if (!v) return `<p class="rt-nofr">Nincs ${f.cel} kcal-os változata.</p>`;
      const m = v.makro;
      return `<div class="rt-fr">
        <div class="rt-fr-hd"><span class="rt-chip">${f.cel}</span>
          <span class="rt-fr-k">${m.kcal}</span><span class="rt-fr-u">kcal</span>${macroSpan(m)}</div>
        ${barHtml(m, max)}
      </div>`;
    }).join('');
    return `<article class="rt-card">
      <div class="rt-top">
        <span class="rt-cat">${esc(katNev(r))}${r.own ? ' · saját' : ''}</span>
        <span class="rt-min">${r.perc} perc</span>
        <div class="rt-act">
          <button class="${fav ? 'on' : ''}" data-fav="${r.id}" aria-pressed="${fav}"
            aria-label="${fav ? 'Kedvenc — kattints a levételhez' : 'Jelöld kedvencnek'}"
            title="${fav ? 'Kedvenc — kattints a levételhez' : 'Jelöld kedvencnek'}">${fav ? '★' : '☆'}</button>
          ${db ? `<button class="on" data-remove="${r.id}"
            aria-label="${esc(holCimke(r.id))} — kattints a kivételhez"
            title="${esc(holCimke(r.id))} — kattints a kivételhez"
            ><span class="ic-v">✓</span><span class="ic-x">✕</span></button>`
          : `<button data-quick="${r.id}"
            aria-label="Hozzáadás a mai étrendhez" title="Hozzáadás a mai étrendhez">+</button>`}
        </div>
      </div>
      <button class="rt-open" data-open="${r.id}">
        <h3 class="rt-name">${esc(r.nev)}</h3>
      </button>
      <div class="rt-tear"></div>
      ${frames}
    </article>`;
  }).join('');
}

/* ---------- étrendterv ---------- */
function drawWeek() {
  const veg = plusz(hetKezd, 6);
  const cim = hetKezd.getMonth() === veg.getMonth()
    ? `${hetKezd.getFullYear()}. ${HO[hetKezd.getMonth()]} ${hetKezd.getDate()}—${veg.getDate()}.`
    : `${HO[hetKezd.getMonth()]} ${hetKezd.getDate()}. — ${HO[veg.getMonth()]} ${veg.getDate()}.`;
  el('wkTitle').textContent = cim;

  el('week').innerHTML = [0,1,2,3,4,5,6].map(i => {
    const d = plusz(hetKezd, i), key = iso(d), isMa = key === ma();
    const n = napja(key);
    const slots = SLOTS.map(s => {
      const ids = n[s.k] || [];
      return `<div class="rt-slot">
        <p class="rt-label">${s.n}</p>
        ${ids.length ? `<ul>${ids.map((id, ix) => {
          const r = get(id); if (!r) return '';
          const k1 = r.a1 ? r.a1.makro.kcal : null, k2 = r.a2 ? r.a2.makro.kcal : null;
          return `<li><span>${esc(r.nev)}</span><span class="k">${k1 ?? '—'} / ${k2 ?? '—'}</span>
            <button class="rt-rm" data-rm="${key}|${s.k}|${ix}" aria-label="Kivétel">×</button></li>`;
        }).join('')}</ul>` : ''}
        ${(() => {
          const teli = ids.length >= SLOTMAX[s.k];
          if (teli) return `<button class="rt-addslot" data-add="${key}|${s.k}"
            aria-label="${s.n} lecserélése">Csere</button>`;
          return `<button class="rt-addslot" data-add="${key}|${s.k}">+ ${
            s.k === 'kis' && ids.length ? 'még egy kisétkezés' : s.n.toLowerCase()}</button>`;
        })()}
      </div>`;
    }).join('');

    const sum = FRAMES.map(f => {
      const t = napOsszeg(key, f.k);
      const tul = t.kcal > f.cel;
      return `<div class="rt-dsum-row">
          <span class="rt-chip">${f.cel}</span>
          <b class="${tul ? 'rt-over' : ''}">${t.kcal}</b><s>kcal</s>
          <em class="${tul ? 'rt-over' : ''}">${tul ? '+' + (t.kcal - f.cel) : (f.cel - t.kcal) + ' szabad'}</em>
        </div>
        <div class="rt-bar"><div style="width:${Math.min(t.kcal / f.cel, 1) * 100}%">
          <i class="kp" style="flex:${t.p*4||1}"></i><i class="kc" style="flex:${t.c*4}"></i><i class="kf" style="flex:${t.f*9}"></i>
        </div></div>`;
    }).join('');

    return `<div class="rt-dcard ${isMa ? 'ma' : ''}">
      <div class="rt-dcard-hd"><b>${NAPROVID[i]}</b><s>${HO[d.getMonth()].slice(0,3)}. ${d.getDate()}.</s>
        ${isMa ? '<span class="rt-mabadge">ma</span>' : ''}</div>
      ${slots}
      <div class="rt-dsum">${sum}</div>
      <div class="rt-dact">
        <button data-autofill="${key}" title="Töltsd ki a hiányzó étkezéseket">Kitöltés</button>
        <button data-copyday="${key}" title="Másold át egy másik napra">Másolás</button>
        <button class="d" data-clearday="${key}" title="Vedd ki az összes ételt erről a napról">Ürítés</button>
      </div>
    </div>`;
  }).join('');

  drawWeekSum();
}

/* ---------- heti összegzés ---------- */
function drawWeekSum() {
  const napok = [0,1,2,3,4,5,6].map(i => iso(plusz(hetKezd, i))).filter(vanNap);
  if (!napok.length) { el('wksum').innerHTML = ''; return; }
  const t = FRAMES.map(f => {
    const ossz = napok.map(k => napOsszeg(k, f.k));
    return {
      cel: f.cel,
      atlag: Math.round(ossz.reduce((a, x) => a + x.kcal, 0) / napok.length),
      belul: ossz.filter(x => x.kcal <= f.cel).length,
    };
  });
  const atlagP = (napok.reduce((a, k) => a + napOsszeg(k, 'a1').p, 0) / napok.length).toFixed(1).replace('.', ',');
  el('wksum').innerHTML = `
    <div><b>${napok.length} / 7</b><u class="rt-label">betervezett nap</u></div>
    ${t.map(x => `<div><b>${x.atlag}</b><u class="rt-label">átlag az ${keretNev(x.cel)} keretben</u></div>`).join('')}
    <div><b>${atlagP} g</b><u class="rt-label">átlagos fehérje</u></div>
    ${t.map(x => `<div><b>${x.belul} / ${napok.length}</b><u class="rt-label">az ${keretNev(x.cel)} keret alatt</u></div>`).join('')}`;
}

/* ---------- automatikus napkitöltés ----------
   Az 1800-as keret a vezető: veletlen kombinaciokat probal, es azt tartja meg,
   ami a kereten belul a legkozelebb van hozza, kozben sok feherjet ad. */
function autoFillTerv(key) {
  const meglevo = napja(key);
  const cel = 1800;
  const jelolt = s => all().filter(r => slotsOf(r).includes(s) && r.a1);
  const fixKcal = SLOTS.reduce((a, s) => a + (meglevo[s.k] || [])
    .reduce((x, id) => { const r = get(id); return x + (r && r.a1 ? r.a1.makro.kcal : 0); }, 0), 0);
  const ures = ['reggeli','ebed','vacsora'].filter(s => !(meglevo[s] || []).length);
  const kisJelolt = jelolt('kis');
  if (!ures.length && !kisJelolt.length) return null;

  let best = null;
  for (let t = 0; t < 400; t++) {
    const valasztas = {};
    let sum = fixKcal, prot = 0;
    for (const s of ures) {
      const c = jelolt(s); if (!c.length) continue;
      const r = c[Math.floor(Math.random() * c.length)];
      valasztas[s] = [r.id]; sum += r.a1.makro.kcal; prot += r.a1.makro.p;
    }
    const snackek = [];
    for (let g = 0; g < 3 && kisJelolt.length; g++) {
      const r = kisJelolt[Math.floor(Math.random() * kisJelolt.length)];
      if (sum + r.a1.makro.kcal > cel) break;
      snackek.push(r.id); sum += r.a1.makro.kcal; prot += r.a1.makro.p;
    }
    if (snackek.length) valasztas.kis = (meglevo.kis || []).concat(snackek);
    const pont = (sum <= cel ? sum : cel - (sum - cel) * 3) + prot * 2;
    if (!best || pont > best.pont) best = { pont, valasztas, sum };
  }
  return best;
}

/* recept-választó egy naphoz és étkezéshez */
let pickCtx = null, pickQ = '';
function openPick(key, slot) {
  pickCtx = { key, slot }; pickQ = '';
  renderPick();
  openScrim();
  const i = el('pq'); if (i) i.focus();
}
function renderPick() {
  const { key, slot } = pickCtx;
  const [y, mo, d] = key.split('-').map(Number);
  const q = pickQ.trim().toLowerCase();
  const meglevo = (napja(key)[slot] || []);
  const csere = meglevo.length >= SLOTMAX[slot];
  const cserelt = csere ? get(meglevo[meglevo.length - 1]) : null;
  const lista = all().filter(r => slotsOf(r).includes(slot))
    .filter(r => !q || r.nev.toLowerCase().includes(q) ||
      (r.a1 && r.a1.hozz.join(' ').toLowerCase().includes(q)));
  el('sheet').innerHTML = `
    <button class="rt-close" id="x" aria-label="Bezárás">✕</button>
    <div class="rt-sh">
      <p class="rt-label">${HO[mo-1]} ${d}. · ${SLOTNEV[slot]}</p>
      <h2 id="shname">${csere ? 'Mire cseréljük?' : 'Mit teszünk ide?'}</h2>
      ${csere && cserelt ? `<p style="margin:12px 0 0;font-size:13.5px;color:var(--ink-60)">Most ${esc(cserelt.nev)} van itt. Egy napra egy ${SLOTNEV[slot].toLowerCase()} jut, ezért a választásod lecseréli.</p>` : ''}
      <div class="rt-field" style="margin-top:16px">
        <input id="pq" type="search" placeholder="Keresés a ${lista.length} lehetőség között" value="${esc(pickQ)}" aria-label="Keresés">
      </div>
      ${lista.length ? `<ul class="rt-pick">${lista.map(r => {
        const k1 = r.a1 ? r.a1.makro.kcal : null, k2 = r.a2 ? r.a2.makro.kcal : null;
        return `<li><button data-put="${r.id}">
          <span class="nm">${esc(r.nev)}</span>
          <span class="kk">${k1 ?? '—'} / ${k2 ?? '—'} kcal</span></button></li>`;
      }).join('')}</ul>` : `<p class="rt-hint" style="margin-top:14px">Nincs találat.</p>`}
    </div>`;
  const inp = el('pq');
  inp.oninput = e => { pickQ = e.target.value; const p = inp.selectionStart; renderPick(); const n2 = el('pq'); n2.focus(); n2.setSelectionRange(p, p); };
}

/* ---------- nap másolása másik napra ---------- */
function openCopyDay(key) {
  const [y, mo, d] = key.split('-').map(Number);
  const naplista = [];
  for (let i = 0; i < 14; i++) {
    const dt = plusz(hetKezd, i), k = iso(dt);
    if (k === key) continue;
    naplista.push({ k, dt, van: vanNap(k) });
  }
  el('sheet').innerHTML = `
    <button class="rt-close" id="x" aria-label="Bezárás">✕</button>
    <div class="rt-sh">
      <p class="rt-label">${HO[mo-1]} ${d}. másolása</p>
      <h2 id="shname">Melyik napra?</h2>
      <p style="margin:12px 0 0;font-size:13.5px;color:var(--ink-60)">A célnapon lévő ételek helyére kerül, amit ezen a napon beállítottál.</p>
      <ul class="rt-pickday">${naplista.map(n => `<li><button data-pasteday="${key}|${n.k}">
        <span class="nm">${NAPROVID[hetIdx(n.dt)]} — ${HO[n.dt.getMonth()].slice(0,3)}. ${n.dt.getDate()}.</span>
        <span class="st ${n.van ? 'van' : ''}">${n.van ? 'felülírja' : 'üres'}</span></button></li>`).join('')}</ul>

/* ---------- naptár ---------- */
function drawCal() {
  const osszes = Object.keys(etrend).filter(vanNap);
  el('calBadge').textContent = osszes.length;

  const y = calHo.getFullYear(), mo = calHo.getMonth();
  el('calTitle').textContent = `${y}. ${HO[mo]}`;
  const db = new Date(y, mo + 1, 0).getDate(), elotte = hetIdx(new Date(y, mo, 1)), maS = ma();

  let cells = '';
  for (let i = 0; i < elotte; i++) cells += `<div class="rt-day blank"></div>`;
  const honap = [];
  for (let d = 1; d <= db; d++) {
    const key = iso(new Date(y, mo, d)), isMa = key === maS;
    if (!vanNap(key)) { cells += `<div class="rt-day empty ${isMa ? 'ma' : ''}"><span class="rt-day-n">${d}</span></div>`; continue; }
    const t1 = napOsszeg(key, 'a1'), t2 = napOsszeg(key, 'a2');
    honap.push({ t1, t2 });
    cells += `<button class="rt-day has ${isMa ? 'ma' : ''}" data-day="${key}" aria-label="${d}. — ${t1.kcal} és ${t2.kcal} kcal">
      <span class="rt-day-n">${d}</span>
      <span class="rt-day-vals">
        <span class="rt-day-v ${t1.kcal > 1800 ? 'ov' : 'in'}"><b>${t1.kcal}</b>1800</span>
        <span class="rt-day-v ${t2.kcal > 1450 ? 'ov' : 'in'}"><b>${t2.kcal}</b>1450</span>
      </span></button>`;
  }
  el('days').innerHTML = cells;

  if (honap.length) {
    const a1 = Math.round(honap.reduce((a, x) => a + x.t1.kcal, 0) / honap.length);
    const a2 = Math.round(honap.reduce((a, x) => a + x.t2.kcal, 0) / honap.length);
    const b1 = honap.filter(x => x.t1.kcal <= 1800).length;
    el('calSum').innerHTML = `
      <div><b>${honap.length}</b><u class="rt-label">nap ebben a hónapban</u></div>
      <div><b>${a1}</b><u class="rt-label">átlag az 1800-as keretben</u></div>
      <div><b>${a2}</b><u class="rt-label">átlag az 1450-as keretben</u></div>
      <div><b>${b1} / ${honap.length}</b><u class="rt-label">1800 alatt maradt</u></div>`;
  } else el('calSum').innerHTML = '';

  el('calEmpty').innerHTML = osszes.length ? '' : `<div class="rt-cal-empty">
    <p>Még nincs betervezett nap</p>
    <small style="display:block;max-width:44ch;margin:0 auto 16px">Oszd be a heted az Étrendterv fülön. Amint egy naphoz ételt teszel, itt megjelenik — így később visszanézheted, mennyi jött ki aznap.</small>
    <button class="btn btn-p" id="calToPlan">Étrend megnyitása</button></div>`;
  if (el('calToPlan')) el('calToPlan').onclick = () => { hetKezd = hetfoje(new Date()); setView('P'); };
}

/* ---------- alsó sáv ---------- */
function drawBottom() {
  FRAMES.forEach((f, i) => {

    el('bfr' + (i + 1)).innerHTML = `

/* ---------- recept lapja: mindkét keret ---------- */
function openSheet(id) {
  const r = get(id); if (!r) return;
  const max = maxKcal();
  const frBlokk = FRAMES.map(f => {
    const v = r[f.k];
    if (!v) return `<div class="rt-shfr"><div class="rt-shfr-hd"><span class="rt-chip">${f.cel} kcal-os keret</span></div>
      <p class="rt-hint">Ehhez a kerethez nincs változat.</p></div>`;
    const m = v.makro;
    return `<div class="rt-shfr">
      <div class="rt-shfr-hd"><span class="rt-chip">${f.cel} kcal-os keret</span></div>
      <div class="rt-nums">
        <div><b>${m.kcal}</b><u>kcal</u></div>
        <div><b>${num(m.p)}<s>g</s></b><u><i class="kp"></i>fehérje</u></div>
        <div><b>${num(m.c)}<s>g</s></b><u><i class="kc"></i>szénh.</u></div>
        <div><b>${num(m.f)}<s>g</s></b><u><i class="kf"></i>zsír</u></div>
      </div>
      ${barHtml(m, max)}
    </div>`;
  }).join('');

  const ing = `<p class="rt-h3 rt-label">Hozzávalók — keretenként</p><div class="rt-two">
    ${FRAMES.map(f => r[f.k] ? `<div><p class="rt-h4">${f.cel} kcal-os keret</p>
      <ul class="rt-ing">${r[f.k].hozz.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : '').join('')}
  </div>`;

  /* Az elkeszites mindket keretnel ugyanaz -- csak a mennyisegek masok -,
     ezert egyszer irjuk ki. A regi, keretenkent tarolt lepesekre is visszaesunk. */
  const lepesek = (r.lep && r.lep.length) ? r.lep
    : ((r.a1 && r.a1.lep) || (r.a2 && r.a2.lep) || []);
  const lep = lepesek.length
    ? `<p class="rt-h3 rt-label">Elkészítés</p>
       <p style="margin:-4px 0 10px;font-size:12.5px;color:var(--ink-60)">Mindkét kerethez ugyanez a menet — csak a mennyiségek térnek el.</p>
       <ol class="rt-steps">${lepesek.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
    : '';

  el('sheet').innerHTML = `
    <button class="rt-close" id="x" aria-label="Bezárás">✕</button>
    <div class="rt-sh">
      <p class="rt-label">${esc(katNev(r))} · ${r.perc} perc</p>
      <h2 id="shname">${esc(r.nev)}</h2>
      ${frBlokk}${ing}${lep}
      ${r.megj ? `<p class="rt-note">${esc(r.megj)}</p>` : ''}
      <div class="rt-sh-act">
        <button class="btn btn-p" data-quick="${r.id}">+ Mai étrendhez</button>
        <button class="btn btn-s" data-fav="${r.id}">${favs.includes(r.id) ? '★ Kedvenc' : '☆ Kedvencnek'}</button>
        ${r.own ? `<button class="btn btn-s" data-edit="${r.id}">Szerkesztés</button><button class="btn btn-d" id="askDel">Törlés</button>` : ''}
      </div>
      ${r.own ? `<div id="delBox"></div>` : ''}
    </div>`;
  openScrim();
  el('x').focus();
  if (el('askDel')) el('askDel').onclick = () => {
    el('delBox').innerHTML = `<div class="rt-confirm">
      <p>Törlöm a receptet? Az étrendből is kikerül.</p>
      <button class="btn btn-d btn-sm" data-del="${r.id}">Igen, törlöm</button>
      <button class="btn btn-s btn-sm" id="cancelDel">Mégsem</button>
    </div>`;
    el('cancelDel').onclick = () => { el('delBox').innerHTML = ''; el('askDel').focus(); };
    el('delBox').querySelector('[data-del]').focus();
  };
}
let lastFocus = null;
function openScrim() {
  lastFocus = document.activeElement;
  el('scrim').classList.add('open');
}
function closeSheet() {
  const wasOpen = el('scrim').classList.contains('open');
  el('scrim').classList.remove('open');
  if (wasOpen && lastFocus && typeof lastFocus.focus === 'function') {
    try { lastFocus.focus(); } catch (e) {}
  }
  lastFocus = null;
}
/* a fokusz maradjon a megnyitott lapon belul */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !el('scrim').classList.contains('open')) return;
  const f = el('sheet').querySelectorAll('button, input, select, textarea, [href]');
  const list = [...f].filter(x => !x.disabled && x.offsetParent !== null);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

      <div class="rt-field"><label class="rt-label" for="f-hozz">Hozzávalók — egy sorba egy</label>
        <textarea id="f-hozz" placeholder="200 g csirkemell&#10;250 g brokkoli">${r && r.a1 ? esc(r.a1.hozz.join('\n')) : ''}</textarea></div>
      <div class="rt-field"><label class="rt-label" for="f-lep">Elkészítés — egy sorba egy lépés</label>
        <textarea id="f-lep" placeholder="Fűszerezd be a csirkét.&#10;Süsd 200 fokon 25 percig.">${r ? esc(((r.lep && r.lep.length) ? r.lep : (r.a1 && r.a1.lep) || []).join('\n')) : ''}</textarea></div>
      <p class="rt-h3 rt-label">Makrók — 1800 kcal-os keret</p>
      <div class="rt-4">
        <div class="rt-field"><label class="rt-label" for="k1">kcal</label><input id="k1" type="number" min="0" value="${f('a1','kcal')}"></div>
        <div class="rt-field"><label class="rt-label" for="p1">fehérje</label><input id="p1" type="number" min="0" step="0.1" value="${f('a1','p')}"></div>
        <div class="rt-field"><label class="rt-label" for="c1">szénh.</label><input id="c1" type="number" min="0" step="0.1" value="${f('a1','c')}"></div>
        <div class="rt-field"><label class="rt-label" for="z1">zsír</label><input id="z1" type="number" min="0" step="0.1" value="${f('a1','f')}"></div>
      </div>
      <p class="rt-h3 rt-label">Makrók — 1450 kcal-os keret</p>
      <div class="rt-4">
        <div class="rt-field"><label class="rt-label" for="k2">kcal</label><input id="k2" type="number" min="0" value="${f('a2','kcal')}"></div>
        <div class="rt-field"><label class="rt-label" for="p2">fehérje</label><input id="p2" type="number" min="0" step="0.1" value="${f('a2','p')}"></div>
        <div class="rt-field"><label class="rt-label" for="c2">szénh.</label><input id="c2" type="number" min="0" step="0.1" value="${f('a2','c')}"></div>
        <div class="rt-field"><label class="rt-label" for="z2">zsír</label><input id="z2" type="number" min="0" step="0.1" value="${f('a2','f')}"></div>
      </div>
      <p class="rt-hint">A második keret elhagyható — ha üresen hagyod a kcal-t, a kártyán csak az 1800-as sor jelenik meg.</p>
      <div class="rt-sh-act">
        <button class="btn btn-p" id="dosave">${r ? 'Változások mentése' : 'Recept mentése'}</button>
        <button class="btn btn-g" id="cancel">Mégsem</button>
      </div>
    </div>`;
  openScrim();
  el('f-nev').focus();
  el('cancel').onclick = closeSheet;
  el('dosave').onclick = async () => {
    const nev = el('f-nev').value.trim();
    if (!nev) return fail('Adj nevet a receptnek.');
    if (!el('k1').value.trim()) return fail('Az 1800-as keret kalóriaértéke kell — enélkül nem tudom a csíkot kirajzolni.');
    const hozz = el('f-hozz').value.split('\n').map(s => s.trim()).filter(Boolean);
    const lep = el('f-lep').value.split('\n').map(s => s.trim()).filter(Boolean);
    const mk = (k,p,c,z) => ({ kcal:+el(k).value||0, p:+el(p).value||0, c:+el(c).value||0, f:+el(z).value||0 });
    const slots = el('f-slot').value.split(',');
    const rec = { id: r ? r.id : 'o' + Date.now(), own: true, nev, slots,
      kat: slots.map(s => SLOTNEV[s]).join(' / '), perc: +el('f-perc').value || 0, megj: '',

    own = r ? own.map(x => x.id === r.id ? rec : x) : own.concat([rec]);
    await save(KEYS.own, own);
    closeSheet(); drawGrid(); drawWeek(); drawBottom();
    toast(uj ? `${rec.nev} mentve` : 'Változások mentve');
  };
  function fail(msg) { const e = el('err'); e.textContent = msg; e.hidden = false; }
}

/* ---------- biztonsági mentés fájlba ---------- */
function backupBlokk() {
  return `
    <p class="rt-h3 rt-label">Biztonsági mentés</p>
    <p style="margin:0 0 14px;font-size:13.5px;color:var(--ink-60)">
      A kedvenceid, a saját receptjeid és az egész étrended egy fájlba. Jó, ha böngészőt cserélsz,
      vagy ha valaha kitörlöd a böngésző tárolóját.</p>
    <div class="rt-sh-act" style="margin-top:0">
      <button class="btn btn-s" id="doExport">Mentés fájlba</button>
      <button class="btn btn-s" id="doImportBtn">Visszatöltés fájlból</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div id="importBox"></div>`;
}

function bindBackup() {
  const ex = el('doExport'); if (!ex) return;
  ex.onclick = () => {
    const adat = {
      formatum: 'recepttar-mentes',
      verzio: 1,
      mentve: new Date().toISOString(),
      favs, own, etrend,
    };
    const blob = new Blob([JSON.stringify(adat, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `recepttar-mentes-${ma()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Mentés letöltve');
  };

  el('doImportBtn').onclick = () => el('importFile').click();
  el('importFile').onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    let adat;
    try { adat = JSON.parse(await f.text()); }
    catch (e) { return hibaImport('Ez a fájl nem olvasható JSON-ként.'); }
    if (!adat || adat.formatum !== 'recepttar-mentes')
      return hibaImport('Ez nem a Recepttár mentése. Olyan fájlt válassz, amit innen mentettél.');

    const dbRecept = Array.isArray(adat.own) ? adat.own.length : 0;
    const dbNap = adat.etrend ? Object.keys(adat.etrend).length : 0;
    const dbFav = Array.isArray(adat.favs) ? adat.favs.length : 0;
    el('importBox').innerHTML = `<div class="rt-confirm">
      <p>A mentésben ${dbNap} betervezett nap, ${dbRecept} saját recept és ${dbFav} kedvenc van.
      A visszatöltés felülírja a mostani adataidat.</p>
      <button class="btn btn-p btn-sm" id="confirmImport">Visszatöltöm</button>
      <button class="btn btn-s btn-sm" id="cancelImport">Mégsem</button>
    </div>`;
    el('cancelImport').onclick = () => { el('importBox').innerHTML = ''; el('importFile').value = ''; };
    el('confirmImport').onclick = async () => {
      favs = Array.isArray(adat.favs) ? adat.favs : [];
      own = Array.isArray(adat.own) ? adat.own : [];
      own.forEach(r => { if (!r.slots) r.slots = slotsOf(r); });
      etrend = (adat.etrend && typeof adat.etrend === 'object') ? adat.etrend : {};
      await save(KEYS.fav, favs); await save(KEYS.own, own); await save(KEYS.etrend, etrend);
      closeSheet(); drawNav(); redrawAll();
      toast(`Visszatöltve: ${dbNap} nap, ${dbRecept} saját recept`);
    };
  };
  function hibaImport(msg) {
    el('importBox').innerHTML = `<p class="rt-err" style="margin-top:14px">${esc(msg)}</p>`;
    el('importFile').value = '';
  }
}

  if (!firebaseConfigured()) {

        ${backupBlokk()}
      </div>`;
    openScrim();
    el('x').focus();
    bindBackup();
    return;
  }
  if (fbUser) {
    el('sheet').innerHTML = `
      <button class="rt-close" id="x" aria-label="Bezárás">✕</button>
      <div class="rt-sh">
        <p class="rt-label">Fiók</p>
        <h2 id="shname">Szinkronban vagy</h2>
        <div class="rt-acc-row" style="margin-top:18px">
          <div class="who"><b>${esc(fbUser.email || 'Bejelentkezve')}</b><span>Az adataid minden eszközön ugyanazok lesznek.</span></div>
          <span class="rt-sync-badge rt-sync-on">Élő</span>
        </div>
        <div class="rt-sh-act"><button class="btn btn-d" id="signout">Kijelentkezés</button></div>
        ${backupBlokk()}
      </div>`;
    openScrim();
    bindBackup();
    el('signout').onclick = async () => { await fbAuth.signOut(); fbUser = null; drawAccount(); closeSheet(); toast('Kijelentkeztél — az adatok ezen az eszközön maradnak'); };
    return;
  }
  renderAuthForm('signin');
}

function renderAuthForm(mode, msg) {
  const isSignin = mode === 'signin';
  el('sheet').innerHTML = `
    <button class="rt-close" id="x" aria-label="Bezárás">✕</button>
    <div class="rt-sh">
      <p class="rt-label">Szinkronizálás</p>
      <h2 id="shname">${isSignin ? 'Belépés' : 'Új fiók létrehozása'}</h2>
      <p class="rt-err" id="authErr" ${msg ? '' : 'hidden'}>${msg ? esc(msg) : ''}</p>
      <div class="rt-field" style="margin-top:16px"><label class="rt-label" for="authEmail">E-mail cím</label>
        <input id="authEmail" type="email" placeholder="te@example.com" autocomplete="username"></div>
      <div class="rt-field"><label class="rt-label" for="authPw">Jelszó</label>
        <input id="authPw" type="password" placeholder="legalább 6 karakter" autocomplete="${isSignin ? 'current-password' : 'new-password'}"></div>
      <div class="rt-sh-act">
        <button class="btn btn-p" id="authGo">${isSignin ? 'Belépés' : 'Fiók létrehozása'}</button>
        <button class="btn btn-g" id="authSwitch">${isSignin ? 'Nincs még fiókod? Regisztrálj' : 'Már van fiókod? Lépj be'}</button>
      </div>
      ${backupBlokk()}
    </div>`;
  openScrim();
  bindBackup();
  el('authEmail').focus();
  el('authSwitch').onclick = () => renderAuthForm(isSignin ? 'signup' : 'signin');
  el('authGo').onclick = async () => {
    const email = el('authEmail').value.trim(), pw = el('authPw').value;
    if (!email || !pw) return renderAuthForm(mode, 'Add meg az e-mail címed és a jelszavad.');
    try {
      const cred = isSignin
        ? await fbAuth.signInWithEmailAndPassword(email, pw)
        : await fbAuth.createUserWithEmailAndPassword(email, pw);
      await syncAfterSignIn(cred.user);
      closeSheet();
    } catch (e) {
      const hu = {
        'auth/invalid-email': 'Érvénytelen e-mail cím.',
        'auth/user-not-found': 'Nincs ilyen fiók — hozz létre egyet.',
        'auth/wrong-password': 'Hibás jelszó.',
        'auth/email-already-in-use': 'Ez az e-mail cím már foglalt — lépj be helyette.',
        'auth/weak-password': 'A jelszó legalább 6 karakter legyen.',
      }[e.code] || 'Hiba történt, próbáld újra.';
      renderAuthForm(mode, hu);
    }
  };
}

/* ---------- nézetváltás ---------- */
function setView(v) {
  view = v;
  [['R','tabR','viewR'],['P','tabP','viewP'],['C','tabC','viewC']].forEach(([k, t, w]) => {
    el(t).setAttribute('aria-pressed', v === k);
    el(w).hidden = v !== k;
  });
  if (v === 'P') drawWeek();
  if (v === 'C') drawCal();
}
el('tabR').onclick = () => setView('R');
el('tabP').onclick = () => setView('P');
el('tabC').onclick = () => setView('C');
function setQuery(v) {
  query = v;
  el('q').value = v;
  el('clearq').hidden = !v;
  drawGrid();
}
el('q').oninput = e => setQuery(e.target.value);
el('q').onkeydown = e => { if (e.key === 'Escape' && query) { e.stopPropagation(); setQuery(''); } };
el('clearq').onclick = () => { setQuery(''); el('q').focus(); };
el('new').onclick = () => openEditor(null);
function setFit(v) {
  csakBelefer = v;
  el('fitBtn').setAttribute('aria-pressed', v);
  drawGrid();
}
el('fitBtn').onclick = () => setFit(!csakBelefer);
el('sortSel').onchange = e => { sortBy = e.target.value; drawGrid(); };
el('nav').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; filter = b.dataset.c; drawNav(); drawGrid(); };
document.addEventListener('click', e => {
  const rs = e.target.closest('[data-reset]');
  if (rs) { filter = rs.dataset.reset; setQuery(''); drawNav(); drawGrid(); }
});
el('wprev').onclick = () => { hetKezd = plusz(hetKezd, -7); drawWeek(); };
el('wnext').onclick = () => { hetKezd = plusz(hetKezd, 7); drawWeek(); };
el('wtoday').onclick = () => { hetKezd = hetfoje(new Date()); drawWeek(); };
el('wdup').onclick = async () => {
  const forras = [0,1,2,3,4,5,6].map(i => iso(plusz(hetKezd, i)));
  if (!forras.some(vanNap)) { toast('Ez a hét üres — nincs mit átmásolni'); return; }
  snapshot();
  forras.forEach((k, i) => {
    const cel = iso(plusz(hetKezd, i + 7));
    if (vanNap(k)) etrend[cel] = JSON.parse(JSON.stringify(napja(k)));
    else delete etrend[cel];
  });
  await save(KEYS.etrend, etrend);
  hetKezd = plusz(hetKezd, 7);
  redrawAll();
  toast('A hét átmásolva a következőre', true);
};
el('cprev').onclick = () => { calHo = new Date(calHo.getFullYear(), calHo.getMonth() - 1, 1); drawCal(); };
el('cnext').onclick = () => { calHo = new Date(calHo.getFullYear(), calHo.getMonth() + 1, 1); drawCal(); };
el('ctoday').onclick = () => { calHo = new Date(); drawCal(); };
el('goToday').onclick = () => { hetKezd = hetfoje(new Date()); setView('P'); };
el('tabAcc').onclick = openAccount;

document.addEventListener('click', async e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    const id = fav.dataset.fav;
    favs = favs.includes(id) ? favs.filter(x => x !== id) : favs.concat([id]);
    await save(KEYS.fav, favs); drawNav(); drawGrid();
    if (el('scrim').classList.contains('open') && el('sheet').querySelector('[data-fav]')) openSheet(id);
    return;
  }
  const qk = e.target.closest('[data-quick]');
  if (qk) {
    const r = get(qk.dataset.quick); if (!r) return;
    const sl = slotsOf(r);
    if (sl.length > 1) { return openSlotChoice(r.id); }   // ebed vagy vacsora? dontsd el te
    if (el('scrim').classList.contains('open')) closeSheet();
    await addTo(ma(), sl[0], r.id);
    return;
  }
  const rmToday = e.target.closest('[data-remove]');
  if (rmToday) { await removeToday(rmToday.dataset.remove); return; }
  const sp = e.target.closest('[data-slotpick]');
  if (sp) {
    const [id, slot] = sp.dataset.slotpick.split('|');
    closeSheet();
    await addTo(ma(), slot, id);
    return;
  }
  const add = e.target.closest('[data-add]');
  if (add) { const [key, slot] = add.dataset.add.split('|'); return openPick(key, slot); }
  const put = e.target.closest('[data-put]');
  if (put) {
    const { key, slot } = pickCtx;
    closeSheet();
    await addTo(key, slot, put.dataset.put);
    return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const [key, slot, ix] = rm.dataset.rm.split('|');
    const arr = (napja(key)[slot] || []).slice();
    const kivett = get(arr[+ix]);
    arr.splice(+ix, 1);
    snapshot();
    await setSlot(key, slot, arr);
    toast(`${kivett ? kivett.nev : 'Tétel'} kivéve`, true);
    return;
  }
  const af = e.target.closest('[data-autofill]');
  if (af) {
    const key = af.dataset.autofill;
    const best = autoFillTerv(key);
    if (!best || !Object.keys(best.valasztas).length) { toast('Ezen a napon már minden étkezés be van állítva'); return; }
    snapshot();
    const n = { ...napja(key), ...best.valasztas };
    etrend[key] = n;
    await save(KEYS.etrend, etrend);
    redrawAll();
    const t = napOsszeg(key, 'a1');
    toast(`A nap kitöltve — ${t.kcal} kcal az 1800-as keretben`, true);
    return;
  }
  const cd = e.target.closest('[data-copyday]'); if (cd) return openCopyDay(cd.dataset.copyday);
  const pd = e.target.closest('[data-pasteday]');
  if (pd) {
    const [src, dst] = pd.dataset.pasteday.split('|');
    snapshot();
    etrend[dst] = JSON.parse(JSON.stringify(napja(src)));
    await save(KEYS.etrend, etrend);
    closeSheet(); redrawAll();
    const [yy, mm, dd] = dst.split('-').map(Number);
    toast(`Átmásolva ide: ${HO[mm-1].slice(0,3)}. ${dd}.`, true);
    return;
  }
  const cld = e.target.closest('[data-clearday]');
  if (cld) {
    const key = cld.dataset.clearday;
    if (!vanNap(key)) { toast('Ez a nap már üres'); return; }
    snapshot();
    delete etrend[key];
    await save(KEYS.etrend, etrend);
    redrawAll();
    toast('A nap kiürítve', true);
    return;
  }
  const day = e.target.closest('[data-day]'); if (day) return openDay(day.dataset.day);
  const wk = e.target.closest('[data-week]');
  if (wk) { const [y, mo, d] = wk.dataset.week.split('-').map(Number);
    hetKezd = hetfoje(new Date(y, mo - 1, d)); closeSheet(); setView('P'); return; }
  const dd = e.target.closest('[data-delday]');
  if (dd) {
    snapshot();
    delete etrend[dd.dataset.delday];
    await save(KEYS.etrend, etrend);
    closeSheet(); redrawAll();
    toast('A nap kiürítve', true);
    return;
  }
  const ed = e.target.closest('[data-edit]'); if (ed) return openEditor(ed.dataset.edit);
  const del = e.target.closest('[data-del]');
  if (del) {
    const id = del.dataset.del;
    own = own.filter(x => x.id !== id); favs = favs.filter(x => x !== id);
    Object.keys(etrend).forEach(k => SLOTS.forEach(s => {
      if (etrend[k][s.k]) etrend[k][s.k] = etrend[k][s.k].filter(x => x !== id);
    }));
    Object.keys(etrend).forEach(k => { if (!vanNap(k)) delete etrend[k]; });
    await save(KEYS.own, own); await save(KEYS.fav, favs); await save(KEYS.etrend, etrend);
    closeSheet(); drawNav(); redrawAll();
    toast('Recept törölve');
    return;
  }
  if (e.target.id === 'x' || e.target.id === 'scrim') return closeSheet();
  const card = e.target.closest('[data-open]'); if (card) openSheet(card.dataset.open);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

(async () => {
  favs = await load(KEYS.fav, []);
  own = await load(KEYS.own, []);
  own.forEach(r => { if (!r.slots) r.slots = slotsOf(r); });
  etrend = await load(KEYS.etrend, {}) || {};

  // korabbi, egyetlen "napi terv" listat athozzuk a mai nap etkezeseibe
  const regi = await load(KEYS.oldplan, null);
  if (regi && !Object.keys(etrend).length) {
    const ids = Array.isArray(regi) ? regi : [...(regi.a1 || []), ...(regi.a2 || [])];
    const n = { reggeli: [], ebed: [], vacsora: [], kis: [] };
    [...new Set(ids)].forEach(id => { const r = get(id); if (r) n[slotsOf(r)[0]].push(id); });
    if (SLOTS.some(s => n[s.k].length)) { etrend[ma()] = n; await save(KEYS.etrend, etrend); }
  }

  drawNav(); drawGrid(); drawWeek(); drawCal(); drawBottom(); drawAccount();

  if (fbAuth) {
    fbAuth.onAuthStateChanged(async (user) => {
      if (user && (!fbUser || fbUser.uid !== user.uid)) { await syncAfterSignIn(user); }
      else if (!user) { fbUser = null; drawAccount(); }
    });
  }
})();
</script>
